<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuckDuckGo Search</title>
  <meta name="description" content="Private search powered by DuckDuckGo" />
  <link rel="icon" href="https://duckduckgo.com/favicon.ico" />
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #de5833;
      --accent-hover: #f06a45;
      --input-bg: #12151b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(222, 88, 51, 0.12), transparent);
    }

    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      user-select: none;
    }

    .logo svg {
      width: 48px;
      height: 48px;
    }

    .logo h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--accent);
    }

    form {
      position: relative;
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 6px 6px 6px 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(222, 88, 51, 0.25), 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    input[type="search"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1.05rem;
      padding: 12px 8px;
      min-width: 0;
    }

    input[type="search"]::placeholder {
      color: var(--muted);
    }

    /* Hide default clear button on some browsers */
    input[type="search"]::-webkit-search-cancel-button {
      -webkit-appearance: none;
    }

    button[type="submit"] {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 22px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    button[type="submit"]:active {
      transform: scale(0.97);
    }

    .hints {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .hint {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      text-decoration: none;
    }

    .hint:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(222, 88, 51, 0.08);
    }

    .footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--accent);
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .logo h1 {
        font-size: 1.4rem;
      }
      button[type="submit"] span {
        display: none;
      }
      button[type="submit"] {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <!-- Simple duck icon -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#DE5833"/>
        <path d="M20 36c0-8 6-14 14-14s14 6 14 14c0 2-1 4-2 5.5C44 44 40 46 32 46s-12-2-14-4.5C19 40 20 38 20 36z" fill="#fff"/>
        <circle cx="26" cy="30" r="3" fill="#0f1115"/>
        <path d="M38 28c4 0 8 2 10 5l4-1c-2-5-7-8-14-8v4z" fill="#F5A623"/>
      </svg>
      <h1>Duck<span>Search</span></h1>
    </div>

    <form action="https://duckduckgo.com/" method="get" role="search">
      <div class="search-box">
        <input
          type="search"
          name="q"
          placeholder="Search the web privately…"
          autocomplete="off"
          autofocus
          required
          aria-label="Search query"
        />
        <button type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <span>Search</span>
        </button>
      </div>
    </form>

    <div class="hints">
      <a class="hint" href="https://duckduckgo.com/?q=!w+weather">!w weather</a>
      <a class="hint" href="https://duckduckgo.com/?q=!g+github">!g github</a>
      <a class="hint" href="https://duckduckgo.com/?q=!yt+music">!yt music</a>
      <a class="hint" href="https://duckduckgo.com/?q=!maps+coffee+near+me">!maps near me</a>
      <a class="hint" href="https://duckduckgo.com/?q=!a+headphones">!a amazon</a>
    </div>

    <p class="footer">
      Powered by <a href="https://duckduckgo.com" target="_blank" rel="noopener">DuckDuckGo</a> ·
      No tracking · Hosted on GitHub Pages
    </p>
  </div>

  <script>
    // Optional: focus the input if the page is reloaded
    document.querySelector('input[name="q"]').focus();
  </script>
</body>
</html>

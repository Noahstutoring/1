<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuckDuckGo Search</title>
  <meta name="description" content="Private search powered by DuckDuckGo" />
  <link rel="icon" href="https://duckduckgo.com/favicon.ico" />
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --border: #2a2f3a;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #de5833;
      --accent-hover: #f06a45;
      --input-bg: #12151b;
      --link: #8ab4f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(222, 88, 51, 0.12), transparent);
    }

    .container {
      width: 100%;
      max-width: 680px;
      text-align: center;
      margin-top: 8vh;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      user-select: none;
    }

    .logo svg { width: 46px; height: 46px; }

    .logo h1 {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }

    form { width: 100%; }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 6px 6px 6px 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(222, 88, 51, 0.25), 0 4px 24px rgba(0, 0, 0, 0.25);
    }

    input[type="search"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1.05rem;
      padding: 12px 8px;
      min-width: 0;
    }

    input[type="search"]::placeholder { color: var(--muted); }
    input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

    button[type="submit"] {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 22px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:active { transform: scale(0.97); }

    .note {
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hints {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .hint {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      text-decoration: none;
    }

    .hint:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(222, 88, 51, 0.08);
    }

    /* Instant Answer box */
    #instant {
      display: none;
      margin-top: 32px;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      max-width: 100%;
    }

    #instant h2 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: var(--text);
    }

    #instant .abstract {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 12px;
    }

    #instant a {
      color: var(--link);
      text-decoration: none;
      font-size: 0.9rem;
    }

    #instant a:hover { text-decoration: underline; }

    .full-results {
      margin-top: 16px;
      display: inline-block;
      background: var(--accent);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .full-results:hover { background: var(--accent-hover); }

    .footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer a:hover { color: var(--accent); }

    @media (max-width: 480px) {
      .logo h1 { font-size: 1.4rem; }
      button[type="submit"] span { display: none; }
      button[type="submit"] { padding: 12px 16px; }
      .container { margin-top: 4vh; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#DE5833"/>
        <path d="M20 36c0-8 6-14 14-14s14 6 14 14c0 2-1 4-2 5.5C44 44 40 46 32 46s-12-2-14-4.5C19 40 20 38 20 36z" fill="#fff"/>
        <circle cx="26" cy="30" r="3" fill="#0f1115"/>
        <path d="M38 28c4 0 8 2 10 5l4-1c-2-5-7-8-14-8v4z" fill="#F5A623"/>
      </svg>
      <h1>Duck<span>Search</span></h1>
    </div>

    <!-- This form goes to the REAL DuckDuckGo -->
    <form action="https://duckduckgo.com/" method="get" id="searchForm" role="search">
      <div class="search-box">
        <input
          type="search"
          name="q"
          id="q"
          placeholder="Search the web privately…"
          autocomplete="off"
          autofocus
          required
          aria-label="Search query"
        />
        <button type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <span>Search</span>
        </button>
      </div>
    </form>

    <p class="note">Searches go directly to DuckDuckGo · No tracking on this page</p>

    <div class="hints">
      <a class="hint" href="https://duckduckgo.com/?q=!w+weather">!w weather</a>
      <a class="hint" href="https://duckduckgo.com/?q=!g+github">!g github</a>
      <a class="hint" href="https://duckduckgo.com/?q=!yt+music">!yt music</a>
      <a class="hint" href="https://duckduckgo.com/?q=!maps+coffee+near+me">!maps near me</a>
      <a class="hint" href="https://duckduckgo.com/?q=!a+headphones">!a amazon</a>
    </div>

    <!-- Instant Answer (optional bonus from DuckDuckGo free API) -->
    <div id="instant">
      <h2 id="ia-heading"></h2>
      <p class="abstract" id="ia-abstract"></p>
      <a id="ia-source" target="_blank" rel="noopener"></a>
      <div style="margin-top:16px">
        <a class="full-results" id="ia-full" href="#">See full results on DuckDuckGo →</a>
      </div>
    </div>

    <p class="footer">
      Powered by the real <a href="https://duckduckgo.com" target="_blank" rel="noopener">DuckDuckGo</a> ·
      Hosted on GitHub Pages
    </p>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('q');
    const instant = document.getElementById('instant');

    // Optional: show Instant Answer first, then let user go to full results
    form.addEventListener('submit', async function(e) {
      const query = input.value.trim();
      if (!query) return;

      // Always go to real DuckDuckGo (this is the important part)
      // We just optionally try to show an Instant Answer first
      try {
        e.preventDefault(); // temporary so we can check Instant Answer

        const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`);
        const data = await res.json();

        if (data.AbstractText || data.Heading) {
          document.getElementById('ia-heading').textContent = data.Heading || query;
          document.getElementById('ia-abstract').textContent = data.AbstractText || data.Answer || '';
          const source = document.getElementById('ia-source');
          if (data.AbstractURL) {
            source.href = data.AbstractURL;
            source.textContent = data.AbstractSource ? `Source: ${data.AbstractSource}` : 'Read more';
            source.style.display = 'inline';
          } else {
            source.style.display = 'none';
          }
          document.getElementById('ia-full').href = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
          instant.style.display = 'block';

          // Still offer the real search
          // User can click the button or just submit again
        } else {
          // No Instant Answer → go straight to real DuckDuckGo
          window.location.href = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
        }
      } catch (err) {
        // If API fails, just go to real DuckDuckGo
        window.location.href = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
      }
    });

    // Focus input
    input.focus();
  </script>
</body>
</html>
